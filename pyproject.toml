[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "order-saga"
version = "0.1.0"
description = "Event contracts and resilience primitives for the order saga"
requires-python = ">=3.9"
dependencies = [
    "aiokafka>=0.10,<1",
    "fastapi>=0.110,<1",
    "opentelemetry-api>=1.27,<2",
    "opentelemetry-exporter-otlp-proto-http>=1.27,<2",
    "opentelemetry-sdk>=1.27,<2",
    "psycopg[binary]>=3.1,<4",
    "sqlalchemy>=2.0,<3",
    "uvicorn[standard]>=0.27,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-cov>=5,<7"]

[tool.pytest.ini_options]
pythonpath = ["packages/event_bus", "packages/observability"]
addopts = "-ra --import-mode=importlib --cov --cov-report=term-missing --cov-fail-under=85"

[tool.coverage.run]
source = [
    "packages/event_bus/event_bus",
    "packages/observability/observability",
    "services/order_service/order_service",
    "services/inventory_service/inventory_service",
    "services/payment_service/payment_service",
    "services/notification_service/notification_service",
]
omit = ["*/tests/*", "*/migrations/*"]

[tool.coverage.report]
fail_under = 85
show_missing = true
skip_covered = true

[tool.setuptools.packages.find]
where = ["packages/event_bus", "packages/observability"]
