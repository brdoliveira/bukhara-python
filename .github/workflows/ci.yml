name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Testes, cobertura e especificação
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Baixar o código
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Configurar Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]"

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Executar testes, cobertura e produzir provas
        run: |
          for feature in fluxo-pedidos observabilidade documentacao-arquitetura qualidade-codigo ci-github-actions; do
            npx --yes @onovoprogramador/onp-spec@0.9.0 verify "$feature"
          done

      - name: Auditar especificações
        run: npx --yes @onovoprogramador/onp-spec@0.9.0 audit --ci
